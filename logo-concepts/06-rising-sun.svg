    <line x1="32" y1="8" x2="32" y2="18"/>
    <line x1="12" y1="20" x2="18" y2="26"/>
    <line x1="52" y1="20" x2="46" y2="26"/>
    <line x1="4" y1="40" x2="12" y2="40"/>
    <line x1="52" y1="40" x2="60" y2="40"/>
  </g>
</svg>
