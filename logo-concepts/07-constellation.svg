  <g stroke="#60A5FA" stroke-width="1.5" opacity="0.7">
    <line x1="32" y1="8" x2="20" y2="24"/>
    <line x1="32" y1="8" x2="44" y2="24"/>
    <line x1="20" y1="24" x2="12" y2="44"/>
    <line x1="20" y1="24" x2="32" y2="40"/>
    <line x1="44" y1="24" x2="52" y2="44"/>
    <line x1="44" y1="24" x2="32" y2="40"/>
    <line x1="32" y1="40" x2="24" y2="56"/>
    <line x1="32" y1="40" x2="40" y2="56"/>
    <line x1="12" y1="44" x2="24" y2="56"/>
    <line x1="52" y1="44" x2="40" y2="56"/>
