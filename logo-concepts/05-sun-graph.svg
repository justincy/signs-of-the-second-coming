<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sun with graph nodes at the end of rays -->
  <!-- Central sun -->
  <circle cx="32" cy="32" r="10" fill="#F59E0B"/>
  <!-- Rays with nodes -->
  <g stroke="#F59E0B" stroke-width="2">
    <line x1="32" y1="22" x2="32" y2="10"/>
    <line x1="32" y1="42" x2="32" y2="54"/>
    <line x1="22" y1="32" x2="10" y2="32"/>
    <line x1="42" y1="32" x2="54" y2="32"/>
    <line x1="25" y1="25" x2="15" y2="15"/>
    <line x1="39" y1="39" x2="49" y2="49"/>
    <line x1="39" y1="25" x2="49" y2="15"/>
    <line x1="25" y1="39" x2="15" y2="49"/>
  </g>
  <!-- Nodes at ray ends -->
  <g fill="#F59E0B">
    <circle cx="32" cy="8" r="4"/>
    <circle cx="32" cy="56" r="4"/>
    <circle cx="8" cy="32" r="4"/>
    <circle cx="56" cy="32" r="4"/>
    <circle cx="13" cy="13" r="3"/>
    <circle cx="51" cy="51" r="3"/>
    <circle cx="51" cy="13" r="3"/>
    <circle cx="13" cy="51" r="3"/>
  </g>
</svg>
